<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ngôi Sao 5 Cánh Huyền Ảo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #ffd700;
      --glow-core: #fff7b2;
      --glow-outer: rgba(255, 215, 0, 0.45);
      --bg-dark: #070913;
      --bg-gradient: radial-gradient(circle at center, #141b38 0%, #080b18 60%, #03050c 100%);
      --accent-color: #ffaa00;
    }

    [data-theme="cyan"] {
      --primary-color: #00f0ff;
      --glow-core: #e0ffff;
      --glow-outer: rgba(0, 240, 255, 0.5);
      --bg-gradient: radial-gradient(circle at center, #0d283d 0%, #061320 60%, #02070c 100%);
      --accent-color: #0099ff;
    }

    [data-theme="purple"] {
      --primary-color: #e056fd;
      --glow-core: #fae8ff;
      --glow-outer: rgba(224, 86, 253, 0.5);
      --bg-gradient: radial-gradient(circle at center, #2e124d 0%, #150826 60%, #06020c 100%);
      --accent-color: #be2edd;
    }

    [data-theme="emerald"] {
      --primary-color: #2ed573;
      --glow-core: #e3fcef;
      --glow-outer: rgba(46, 213, 115, 0.5);
      --bg-gradient: radial-gradient(circle at center, #0d3824 0%, #061e12 60%, #020b06 100%);
      --accent-color: #10ac84;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      background: var(--bg-gradient);
      color: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: background 1s ease;
      user-select: none;
    }

    /* Background starry sky canvas */
    #space-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Header title */
    .title-wrapper {
      position: absolute;
      top: 36px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-20px);
      animation: fadeInDown 1.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
    }

    .title-wrapper h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 20%, var(--primary-color) 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 35px var(--glow-outer);
    }

    .title-wrapper p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.65);
      margin-top: 6px;
      letter-spacing: 1.5px;
      font-weight: 300;
    }

    /* Central Stage for the Star */
    .stage {
      position: relative;
      z-index: 5;
      width: 480px;
      height: 480px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Outer glowing cosmic aura rings */
    .cosmic-ring {
      position: absolute;
      border-radius: 50%;
      border: 1px dashed var(--glow-outer);
      opacity: 0;
      pointer-events: none;
      transform: scale(0.6) rotate(0deg);
      transition: border-color 0.8s ease;
    }

    .ring-1 {
      width: 360px;
      height: 360px;
      animation: ringAppear 2.5s ease-out 0.8s forwards, spinSlow 40s linear infinite;
    }

    .ring-2 {
      width: 440px;
      height: 440px;
      border-style: dotted;
      animation: ringAppear 2.8s ease-out 1.2s forwards, spinReverse 55s linear infinite;
    }

    /* Ambient pulse glow behind star */
    .star-nebula-glow {
      position: absolute;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-outer) 0%, rgba(255, 215, 0, 0.05) 60%, transparent 80%);
      filter: blur(28px);
      opacity: 0;
      transform: scale(0.4);
      animation: nebulaEmerge 3s cubic-bezier(0.2, 0.8, 0.2, 1) 0.8s forwards, pulseGlow 4s ease-in-out infinite alternate;
      pointer-events: none;
    }

    /* Main SVG Star Container */
    .star-svg-container {
      width: 100%;
      height: 100%;
      position: relative;
      filter: drop-shadow(0 0 25px var(--glow-outer)) drop-shadow(0 0 60px var(--glow-outer));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    svg.star-svg {
      width: 340px;
      height: 340px;
      overflow: visible;
      transform-origin: center center;
      opacity: 0;
      transform: scale(0.2) rotate(-45deg);
      animation: starReveal 3.2s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards, gentleFloat 5s ease-in-out 3.5s infinite alternate;
    }

    /* SVG Stroke path (Draw effect) */
    .star-stroke-path {
      stroke: var(--primary-color);
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: transparent;
      stroke-dasharray: 1200;
      stroke-dashoffset: 1200;
      animation: drawOutline 2.8s cubic-bezier(0.4, 0, 0.2, 1) 0.4s forwards;
    }

    /* SVG Fill path (Gradual glow fill) */
    .star-fill-path {
      fill: url(#starGradient);
      opacity: 0;
      animation: fillShine 2.4s ease-out 1.6s forwards;
    }

    /* Inner core star for extra brilliance */
    .star-core-path {
      fill: url(#coreGradient);
      opacity: 0;
      transform-origin: center center;
      transform: scale(0.85);
      animation: coreShine 2.2s cubic-bezier(0.34, 1.56, 0.64, 1) 2.2s forwards;
    }

    /* Corner node lights (5 vertices) */
    .vertex-node {
      fill: #ffffff;
      opacity: 0;
      filter: drop-shadow(0 0 8px #ffffff) drop-shadow(0 0 16px var(--primary-color));
      transform-origin: center;
    }

    .node-0 { animation: vertexPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.6s forwards; }
    .node-1 { animation: vertexPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.1s forwards; }
    .node-2 { animation: vertexPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.6s forwards; }
    .node-3 { animation: vertexPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 2.1s forwards; }
    .node-4 { animation: vertexPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 2.6s forwards; }

    /* Central Lens Flare / Starburst */
    .starburst {
      position: absolute;
      width: 140px;
      height: 140px;
      pointer-events: none;
      opacity: 0;
      transform: scale(0.1) rotate(0deg);
      animation: flareBurst 2s cubic-bezier(0.2, 0.9, 0.2, 1) 2s forwards, flareRotate 18s linear infinite;
    }

    .starburst .beam {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 220px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ffffff, var(--primary-color), transparent);
      transform-origin: center;
      transform: translate(-50%, -50%);
      filter: blur(1px);
    }

    .starburst .beam:nth-child(2) { transform: translate(-50%, -50%) rotate(45deg); }
    .starburst .beam:nth-child(3) { transform: translate(-50%, -50%) rotate(90deg); }
    .starburst .beam:nth-child(4) { transform: translate(-50%, -50%) rotate(135deg); }

    /* Control Panel Dock */
    .controls-dock {
      position: absolute;
      bottom: 35px;
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 24px;
      background: rgba(18, 22, 38, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.4), 0 0 20px rgba(255, 255, 255, 0.04);
      opacity: 0;
      transform: translateY(25px);
      animation: fadeInUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) 1.2s forwards;
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 9px 18px;
      border-radius: 30px;
      font-size: 0.88rem;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      font-weight: 500;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: 0 4px 15px var(--glow-outer);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Theme color dots */
    .palette-group {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 8px;
      border-left: 1px solid rgba(255, 255, 255, 0.15);
    }

    .palette-btn {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .palette-btn:hover {
      transform: scale(1.2);
    }

    .palette-btn.active {
      border-color: #ffffff;
      transform: scale(1.25);
      box-shadow: 0 0 10px currentColor;
    }

    .palette-gold { background: #ffd700; color: #ffd700; }
    .palette-cyan { background: #00f0ff; color: #00f0ff; }
    .palette-purple { background: #e056fd; color: #e056fd; }
    .palette-emerald { background: #2ed573; color: #2ed573; }

    /* Interactive hint */
    .interactive-hint {
      position: absolute;
      bottom: 95px;
      font-size: 0.85rem;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.45);
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      animation: fadeIn 1.5s ease 2.5s forwards;
    }

    /* Keyframe Animations */
    @keyframes fadeInDown {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes ringAppear {
      to { opacity: 0.35; transform: scale(1) rotate(0deg); }
    }

    @keyframes spinSlow {
      from { transform: scale(1) rotate(0deg); }
      to { transform: scale(1) rotate(360deg); }
    }

    @keyframes spinReverse {
      from { transform: scale(1) rotate(0deg); }
      to { transform: scale(1) rotate(-360deg); }
    }

    @keyframes nebulaEmerge {
      0% { opacity: 0; transform: scale(0.4); }
      50% { opacity: 0.85; transform: scale(1.15); }
      100% { opacity: 0.65; transform: scale(1); }
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); filter: blur(28px); opacity: 0.6; }
      100% { transform: scale(1.18); filter: blur(36px); opacity: 0.85; }
    }

    @keyframes starReveal {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-35deg);
      }
      40% {
        opacity: 0.8;
      }
      70% {
        transform: scale(1.08) rotate(3deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    @keyframes gentleFloat {
      0% { transform: scale(1) translateY(0) rotate(0deg); }
      50% { transform: scale(1.03) translateY(-8px) rotate(1.5deg); }
      100% { transform: scale(1) translateY(0) rotate(0deg); }
    }

    @keyframes drawOutline {
      0% { stroke-dashoffset: 1200; opacity: 0.4; }
      20% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }

    @keyframes fillShine {
      0% { opacity: 0; transform: scale(0.95); }
      50% { opacity: 0.7; }
      100% { opacity: 0.95; transform: scale(1); }
    }

    @keyframes coreShine {
      0% { opacity: 0; transform: scale(0.5); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes vertexPop {
      0% { opacity: 0; transform: scale(0); }
      70% { transform: scale(1.8); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes flareBurst {
      0% { opacity: 0; transform: scale(0.1) rotate(0deg); }
      60% { opacity: 1; transform: scale(1.25) rotate(90deg); }
      100% { opacity: 0.85; transform: scale(1) rotate(120deg); }
    }

    @keyframes flareRotate {
      from { transform: scale(1) rotate(120deg); }
      to { transform: scale(1) rotate(480deg); }
    }

    /* Replay Reset Animation utility */
    .replaying svg.star-svg,
    .replaying .cosmic-ring,
    .replaying .star-nebula-glow,
    .replaying .starburst,
    .replaying .vertex-node,
    .replaying .star-stroke-path,
    .replaying .star-fill-path,
    .replaying .star-core-path {
      animation: none !important;
      opacity: 0 !important;
    }

    /* Sparkle Particle on Click / Mouse Move */
    .sparkle {
      position: absolute;
      pointer-events: none;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px var(--primary-color), 0 0 18px var(--primary-color);
      animation: sparkleFly 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      z-index: 100;
    }

    @keyframes sparkleFly {
      0% { opacity: 1; transform: translate(0, 0) scale(1.2); }
      100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); }
    }
  </style>
</head>
<body>

  <!-- Background Animated Starfield -->
  <canvas id="space-canvas"></canvas>

  <!-- Title Banner -->
  <div class="title-wrapper">
    <h1>Ngôi Sao 5 Cánh</h1>
    <p>Ánh Sáng Khởi Nguyên &bull; Từ Từ Hiện Ra</p>
  </div>

  <!-- Central Star Scene -->
  <div class="stage" id="stage">
    <!-- Cosmic Aura Rings -->
    <div class="cosmic-ring ring-1"></div>
    <div class="cosmic-ring ring-2"></div>

    <!-- Radiant Nebula Glow Behind Star -->
    <div class="star-nebula-glow"></div>

    <!-- Star SVG with 5 points -->
    <div class="star-svg-container">
      <svg class="star-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Star Body Gradient -->
          <linearGradient id="starGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="30%" stop-color="var(--glow-core)" stop-opacity="0.95" />
            <stop offset="70%" stop-color="var(--primary-color)" stop-opacity="0.88" />
            <stop offset="100%" stop-color="var(--accent-color)" stop-opacity="0.75" />
          </linearGradient>

          <!-- Core Star Brilliance Gradient -->
          <radialGradient id="coreGradient" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
            <stop offset="45%" stop-color="var(--glow-core)" stop-opacity="0.9" />
            <stop offset="85%" stop-color="var(--primary-color)" stop-opacity="0.4" />
            <stop offset="100%" stop-color="transparent" stop-opacity="0" />
          </radialGradient>

          <!-- Subtle Drop Shadow Filter -->
          <filter id="starGlowFilter" x="-40%" y="-40%" width="180%" height="180%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1" />
            <feGaussianBlur in="SourceGraphic" stdDeviation="24" result="blur2" />
            <feMerge>
              <feMergeNode in="blur2" />
              <feMergeNode in="blur1" />
              <feMergeNode in="SourceGraphic" />
            </feMerge>
          </filter>
        </defs>

        <!-- 
          5-Point Star Geometry:
          Center: (250, 250), Outer R = 180, Inner r = 68.75
          Vertices:
          P0: (250, 70)
          P1: (290.41, 194.38)
          P2: (421.19, 194.38)
          P3: (315.38, 271.24)
          P4: (355.80, 395.62)
          P5: (250, 318.75)
          P6: (144.20, 395.62)
          P7: (184.62, 271.24)
          P8: (78.81, 194.38)
          P9: (209.59, 194.38)
        -->
        
        <!-- Fill Area -->
        <polygon class="star-fill-path" 
          points="250,70 290.41,194.38 421.19,194.38 315.38,271.24 355.80,395.62 250,318.75 144.20,395.62 184.62,271.24 78.81,194.38 209.59,194.38"
          filter="url(#starGlowFilter)"
        />

        <!-- Inner Core Highlight -->
        <polygon class="star-core-path" 
          points="250,70 290.41,194.38 421.19,194.38 315.38,271.24 355.80,395.62 250,318.75 144.20,395.62 184.62,271.24 78.81,194.38 209.59,194.38"
        />

        <!-- Outlining Stroke for Smooth Draw-In -->
        <polygon class="star-stroke-path" 
          points="250,70 290.41,194.38 421.19,194.38 315.38,271.24 355.80,395.62 250,318.75 144.20,395.62 184.62,271.24 78.81,194.38 209.59,194.38" 
        />

        <!-- Glowing Vertex Nodes on the 5 tips -->
        <circle class="vertex-node node-0" cx="250" cy="70" r="5" />
        <circle class="vertex-node node-1" cx="421.19" cy="194.38" r="5" />
        <circle class="vertex-node node-2" cx="355.80" cy="395.62" r="5" />
        <circle class="vertex-node node-3" cx="144.20" cy="395.62" r="5" />
        <circle class="vertex-node node-4" cx="78.81" cy="194.38" r="5" />
      </svg>

      <!-- Center Lens Flare / Starburst -->
      <div class="starburst">
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
        <div class="beam"></div>
      </div>
    </div>
  </div>

  <div class="interactive-hint">✦ Di chuyển chuột hoặc nhấp để tạo bụi sao &bull; Nhấn nút bên dưới để tùy chỉnh ✦</div>

  <!-- Interactive Control Bar -->
  <div class="controls-dock">
    <button class="btn" id="btn-replay" title="Xem lại hiệu ứng hiện ra">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Phát Lại
    </button>

    <div class="palette-group">
      <button class="palette-btn palette-gold active" data-theme="gold" title="Vàng Ánh Kim"></button>
      <button class="palette-btn palette-cyan" data-theme="cyan" title="Xanh Vũ Trụ"></button>
      <button class="palette-btn palette-purple" data-theme="purple" title="Tím Huyền Bí"></button>
      <button class="palette-btn palette-emerald" data-theme="emerald" title="Ngọc Lục Bảo"></button>
    </div>
  </div>

  <script>
    /* ==========================================================
       1. STARFIELD BACKGROUND ENGINE (Canvas)
       ========================================================== */
    const canvas = document.getElementById('space-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const STAR_COUNT = 140;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initStars();
    }

    function initStars() {
      stars = [];
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.6 + 0.3,
          baseAlpha: Math.random() * 0.7 + 0.2,
          twinkleSpeed: Math.random() * 0.02 + 0.005,
          phase: Math.random() * Math.PI * 2,
          speedY: (Math.random() - 0.5) * 0.15,
          speedX: (Math.random() - 0.5) * 0.15
        });
      }
    }

    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const time = Date.now() * 0.002;

      for (let star of stars) {
        const alpha = star.baseAlpha + Math.sin(time * star.twinkleSpeed * 50 + star.phase) * 0.3;
        ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, alpha))})`;
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
        ctx.fill();

        // Slow drifting movement
        star.x += star.speedX;
        star.y += star.speedY;

        if (star.x < 0) star.x = canvas.width;
        if (star.x > canvas.width) star.x = 0;
        if (star.y < 0) star.y = canvas.height;
        if (star.y > canvas.height) star.y = 0;
      }
      requestAnimationFrame(drawStars);
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    drawStars();

    /* ==========================================================
       2. REPLAY ANIMATION LOGIC
       ========================================================== */
    const stage = document.getElementById('stage');
    const btnReplay = document.getElementById('btn-replay');

    function replayStarAnimation() {
      stage.classList.add('replaying');
      void stage.offsetWidth; // Force DOM reflow to reset CSS animations
      stage.classList.remove('replaying');
      createSparkleBurst(window.innerWidth / 2, window.innerHeight / 2, 24);
    }

    btnReplay.addEventListener('click', replayStarAnimation);

    /* ==========================================================
       3. THEME PICKER (Gold, Cyan, Purple, Emerald)
       ========================================================== */
    const paletteBtns = document.querySelectorAll('.palette-btn');
    paletteBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        paletteBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const theme = btn.getAttribute('data-theme');
        if (theme === 'gold') {
          document.body.removeAttribute('data-theme');
        } else {
          document.body.setAttribute('data-theme', theme);
        }
      });
    });

    /* ==========================================================
       4. INTERACTIVE PARTICLES ON MOUSE MOVE & CLICK
       ========================================================== */
    function createSparkle(x, y, dx, dy) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.left = `${x}px`;
      sparkle.style.top = `${y}px`;
      sparkle.style.setProperty('--dx', `${dx || (Math.random() - 0.5) * 60}px`);
      sparkle.style.setProperty('--dy', `${dy || (Math.random() - 0.5) * 60}px`);
      document.body.appendChild(sparkle);

      setTimeout(() => {
        sparkle.remove();
      }, 1000);
    }

    function createSparkleBurst(x, y, count = 16) {
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + Math.random() * 0.4;
        const dist = 40 + Math.random() * 90;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist;
        createSparkle(x, y, dx, dy);
      }
    }

    let lastMoveTime = 0;
    window.addEventListener('mousemove', (e) => {
      const now = performance.now();
      if (now - lastMoveTime > 45) { // Throttle
        lastMoveTime = now;
        createSparkle(e.clientX, e.clientY);
      }
    });

    window.addEventListener('click', (e) => {
      // Don't burst if clicking controls
      if (e.target.closest('.controls-dock')) return;
      createSparkleBurst(e.clientX, e.clientY, 14);
    });

    /* ==========================================================
       5. 3D PARALLAX EFFECT ON MOUSE MOVE
       ========================================================== */
    const starSvg = document.querySelector('.star-svg');
    window.addEventListener('mousemove', (e) => {
      const cx = window.innerWidth / 2;
      const cy = window.innerHeight / 2;
      const mouseX = (e.clientX - cx) / cx;
      const mouseY = (e.clientY - cy) / cy;
      
      // Gentle 3D perspective shift
      const tiltX = -mouseY * 8;
      const tiltY = mouseX * 8;
      
      stage.style.transform = `perspective(1000px) rotateX(${tiltX}deg) rotateY(${tiltY}deg)`;
    });

    window.addEventListener('mouseleave', () => {
      stage.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg)';
      stage.style.transition = 'transform 0.8s ease';
    });

    window.addEventListener('mouseenter', () => {
      stage.style.transition = 'none';
    });
  </script>
</body>
</html>
