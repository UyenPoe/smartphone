server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index mobile-preview.html index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/javascript application/xml application/json image/svg+xml;

    # Đường dẫn mặc định mở Simulator hoặc chuyển qua trang shop
    location / {
        try_files $uri $uri/ /mobile-preview.html;
    }

    # Trang xem trước giả lập
    location /simulator {
        try_files /mobile-preview.html =404;
    }

    # Các trang mua bán / kho máy cũ
    location /pages/ {
        try_files $uri $uri/ =404;
    }

    # Cache static assets
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
