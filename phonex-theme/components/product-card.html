<article class="px-product-card" data-product-id="{{id}}"><div class="px-product-media">{{image}}</div><p class="px-product-brand">{{brand}}</p><h3>{{name}}</h3><strong>{{price}}</strong><div class="px-product-actions"><a href="{{detail_url}}">Xem chi tiết</a><button type="button" data-add-cart="{{id}}">Thêm giỏ</button><button type="button" data-favorite="{{id}}" aria-label="Yêu thích">♡</button></div></article>
