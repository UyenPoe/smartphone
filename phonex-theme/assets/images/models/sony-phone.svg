<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <!-- Phone Body Shadow & Frame (Sony 21:9 sleek boxy profile) -->
  <rect x="70" y="10" width="260" height="580" rx="16" fill="#18181B" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))"/>
  <!-- Bezel -->
  <rect x="73" y="13" width="254" height="574" rx="14" fill="#27272A"/>
  <!-- Screen (OLED 21:9) -->
  <rect x="79" y="30" width="242" height="540" rx="6" fill="url(#sonyGrad)"/>
  <!-- Wallpaper Gradient -->
  <defs>
    <linearGradient id="sonyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <linearGradient id="sonyWave" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <!-- Ambient Wave Art -->
  <ellipse cx="200" cy="320" rx="90" ry="120" fill="url(#sonyWave)" opacity="0.35" filter="blur(25px)"/>
  <!-- Top Bezel Speaker & Front Camera (Sony classic top bezel camera, no punch hole) -->
  <rect x="175" y="18" width="50" height="3" rx="1.5" fill="#52525B"/>
  <circle cx="270" cy="20" r="3.5" fill="#09090B"/>
  <circle cx="270" cy="20" r="1.5" fill="#3B82F6"/>
  <!-- Clock & Xperia text -->
  <text x="200" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="200" fill="#FFFFFF" text-anchor="middle">10:35</text>
  <text x="200" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#A855F7" text-anchor="middle" letter-spacing="2">SONY XPERIA</text>
  <!-- Bottom Home Bar -->
  <rect x="150" y="555" width="100" height="4" rx="2" fill="#FFFFFF" opacity="0.6"/>
</svg>
