<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <!-- Phone Body Shadow & Frame -->
  <rect x="50" y="20" width="300" height="560" rx="36" fill="#18181B" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))"/>
  <!-- Bezel -->
  <rect x="54" y="24" width="292" height="552" rx="32" fill="#27272A"/>
  <!-- Screen with Subtle Premium Wallpaper Gradient -->
  <rect x="62" y="32" width="276" height="536" rx="26" fill="url(#huaweiGrad)"/>
  <!-- Huawei Wallpaper Design -->
  <defs>
    <linearGradient id="huaweiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#831843"/>
    </linearGradient>
    <linearGradient id="puraCameraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <!-- Screen Art Shapes -->
  <circle cx="200" cy="300" r="80" fill="url(#puraCameraGrad)" opacity="0.4" filter="blur(20px)"/>
  <!-- Punch Hole Camera -->
  <circle cx="200" cy="52" r="6" fill="#09090B"/>
  <circle cx="200" cy="52" r="3" fill="#1E293B"/>
  <!-- On Screen Clock/Widget -->
  <text x="200" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="200" fill="#FFFFFF" text-anchor="middle">10:08</text>
  <text x="200" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" fill="#E2E8F0" text-anchor="middle">HUAWEI XMAGE</text>
  <!-- Bottom Home Bar -->
  <rect x="140" y="550" width="120" height="4" rx="2" fill="#FFFFFF" opacity="0.6"/>
</svg>
