<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="100%" height="100%">
  <!-- Phone Body Shadow & Frame (Pixel rounded pebble corners) -->
  <rect x="60" y="20" width="280" height="560" rx="42" fill="#1E293B" filter="drop-shadow(0 10px 15px rgba(0,0,0,0.15))"/>
  <!-- Bezel -->
  <rect x="64" y="24" width="272" height="552" rx="38" fill="#0F172A"/>
  <!-- Screen -->
  <rect x="72" y="32" width="256" height="536" rx="32" fill="url(#pixelGrad)"/>
  <defs>
    <linearGradient id="pixelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022C22"/>
      <stop offset="50%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="pixelGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#6EE7B7"/>
    </linearGradient>
  </defs>
  <!-- Material You Art Shapes -->
  <circle cx="200" cy="300" r="85" fill="url(#pixelGlow)" opacity="0.3" filter="blur(25px)"/>
  <!-- Center Front Camera -->
  <circle cx="200" cy="52" r="6" fill="#020617"/>
  <circle cx="200" cy="52" r="2.5" fill="#0284C7"/>
  <!-- Google At a Glance Widget -->
  <text x="200" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="300" fill="#FFFFFF" text-anchor="middle">09:30</text>
  <text x="200" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#A7F3D0" text-anchor="middle">Google Pixel</text>
  <!-- Search Bar Pill -->
  <rect x="100" y="470" width="200" height="42" rx="21" fill="#FFFFFF" opacity="0.15"/>
  <text x="135" y="496" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF" opacity="0.8">G Search...</text>
  <!-- Bottom Home Bar -->
  <rect x="140" y="550" width="120" height="4" rx="2" fill="#FFFFFF" opacity="0.6"/>
</svg>
